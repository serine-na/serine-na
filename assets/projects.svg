<svg xmlns="http://www.w3.org/2000/svg" width="900" height="498" viewBox="0 0 900 498" role="img" aria-label="Projects list">
<title>Projects list</title>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c3b37"/><stop offset=".5" stop-color="#082a2a"/><stop offset="1" stop-color="#061f22"/>
  </linearGradient>
  <radialGradient id="glowT" cx=".16" cy=".02" r=".62">
    <stop offset="0" stop-color="#2fd0b0" stop-opacity=".55"/><stop offset="1" stop-color="#2fd0b0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx=".96" cy=".98" r=".5">
    <stop offset="0" stop-color="#3b7be0" stop-opacity=".6"/><stop offset="1" stop-color="#3b7be0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowR" cx=".98" cy=".5" r=".35">
    <stop offset="0" stop-color="#1fa98f" stop-opacity=".25"/><stop offset="1" stop-color="#1fa98f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#021a1c" stop-opacity=".55"/><stop offset="1" stop-color="#02161a" stop-opacity=".7"/>
  </linearGradient>
  <clipPath id="clipCard"><rect width="900" height="498" rx="28"/></clipPath>
</defs>
<g clip-path="url(#clipCard)">
  <rect width="900" height="498" fill="url(#base)"/>
  <rect width="900" height="498" fill="url(#glowT)"/>
  <rect width="900" height="498" fill="url(#glowR)"/>
  <rect width="900" height="498" fill="url(#glowB)"/>
</g>
<rect x=".75" y=".75" width="898.5" height="496.5" rx="27.5" fill="none" stroke="#3fd0b4" stroke-opacity=".38" stroke-width="1.5"/>
<text x="36" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing="2.4" fill="#4fe3c1">PROJECTS.LIST</text>
<text x="190" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#7fd6c6">./projects.sh --all</text>
<text x="864" y="56" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#7fd6c6">0 projects</text>
<line x1="36" y1="72" x2="864" y2="72" stroke="#3fd0b4" stroke-opacity=".45"/>
<rect x="36" y="98" width="828" height="382" rx="14" fill="#02181a" fill-opacity=".78" stroke="#3fd0b4" stroke-opacity=".5"/>
<text x="450" y="285.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#e8fffa">No pinned repositories yet<tspan fill="#4fe3c1"> _</tspan></text>
<text x="450" y="309.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#7fd6c6">Pin repositories on your profile and they will appear here.</text>
</svg>
