  <rect width="900" height="133" fill="url(#glowT)"/>
  <rect width="900" height="133" fill="url(#glowR)"/>
  <rect width="900" height="133" fill="url(#glowB)"/>
</g>
<rect x=".75" y=".75" width="898.5" height="131.5" rx="27.5" fill="none" stroke="#3fd0b4" stroke-opacity=".38" stroke-width="1.5"/>
<rect x="24" y="24" width="852" height="85" rx="22" fill="url(#panel)" stroke="#3fd0b4" stroke-opacity=".45" stroke-width="1"/>
<circle cx="850" cy="50" r="3.5" fill="#2fbf9f"><animate attributeName="opacity" values=".35;1;.35" dur="4s" repeatCount="indefinite"/></circle>
